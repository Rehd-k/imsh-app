name: imsh
description: "IMSH Patient Portal — hospital patient mobile and web app."
publish_to: 'none'
version: 0.1.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core stack (aligned with helty)
  flutter_riverpod: ^3.4.3
  dio: ^5.4.3+1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.4
  auto_route: ^11.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.2
  timezone: ^0.11.1
  gap: ^3.0.1
  google_fonts: ^8.0.2
  cupertino_icons: ^1.0.8

  # Patient MVP features
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.1
  socket_io_client: ^3.0.2
  cached_network_image: ^4.0.0
  skeletonizer: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  table_calendar: ^3.1.3
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  pub_semver: ^2.2.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  flutter_pdfview: ^1.4.4
  printing: ^5.14.2
  pdf: ^3.12.0
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.10.0
  image_cropper: ^12.2.1
  geolocator: ^14.0.2
  permission_handler: ^13.0.2
  record: ^7.1.1
  path_provider: ^2.1.5
  just_audio: ^0.10.4
  video_player: ^2.10.0
  video_player_win: ^3.2.2
  # Config
  envied: ^1.1.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  fl_chart: ^1.2.0
  uuid: ^4.6.0
  curved_navigation_bar: ^1.0.6
  onboarding_overlay: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.11.1
  auto_route_generator: ^10.5.0
  freezed: ^4.0.1
  json_serializable: ^6.13.0
  envied_generator: ^1.1.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/imsh.png
    - assets/vessellogo.png
    - assets/login.mp4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/imsh.png"
  web:
    generate: true
    image_path: "assets/imsh.png"
